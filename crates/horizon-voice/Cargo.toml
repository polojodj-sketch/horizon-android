[package]
name = "horizon-voice"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
rand = "0.10"
# Microphone capture. Enabled with the `mic` feature so platforms without a
# cpal host (and `cargo check` runs without the game's `audio` feature) stay
# buildable.
cpal = { version = "0.16", optional = true }

[features]
default = []
mic = ["dep:cpal"]

[build-dependencies]
cc = "1"

[lints]
workspace = true
