name: Voice APK build
on:
  workflow_dispatch:
  push:
    branches: [voice]
permissions:
  contents: read
concurrency:
  group: voice-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustup default 1.95.0
          rustup target add aarch64-linux-android

      - name: Gradle 8.14
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.14-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.14/bin" >> "$GITHUB_PATH"

      - name: Prepare engine tables
        run: python3 tools/android_prepare.py

      - name: Build arm64 APK
        run: python3 tools/android_build.py --abi arm64-v8a --public

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-voice-arm64
          path: .local/android/apk/arm64-v8a/*.apk
          if-no-files-found: error
